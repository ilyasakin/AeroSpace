# Generated by 'import-config i3'
# Docs: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2

# i3's tree normalization: only redundant nested splits collapse, and 'split' works
i3-normalization = true
accordion-mode = 'i3'

after-startup-command = [
    'exec-and-forget picom -b',
]

focus-follows-mouse.enabled = true
default-root-container-layout = 'accordion'
tiling-policy = 'manual'
mouse-warping = 'output'
workspace-auto-back-and-forth = true
smart-gaps = true

[gaps]
inner.vertical = 10
inner.horizontal = 10
outer.left = 14
outer.bottom = 14
outer.top = 40
outer.right = 14

[workspace-to-monitor-force-assignment]
'1:www' = 'DP-1'
'2:code' = 'main'

[window-borders]
enabled = true
width = 2
active-color = '#285577'

[[window-detection-rules]]
if.app-id = 'net.kovidgoyal.kitty'
if.window-title-regex-substring = 'scratch'
treat-as = 'float'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = "move-node-to-workspace '1:www'"

[[on-window-detected]]
if.app-id = 'net.kovidgoyal.kitty'
if.window-title-regex-substring = 'scratch'
run = ['resize width 1200', 'resize height 800']

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'sticky on'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 4'

[mode.main.binding]
cmd-enter = 'exec-and-forget kitty'
alt-tab = 'workspace-back-and-forth'
cmd-minus = 'resize width -50'
cmd-equal = 'resize width +50'
cmd-p = 'sticky'
cmd-m = 'move-workspace-to-monitor right'
cmd-n = 'move-node-to-monitor next'
cmd-c = 'center-window'
cmd-g = ['fullscreen', 'layout floating tiling']

# ============================================================
# Lines from the i3 config that don't apply on macOS
# ============================================================
# line 12: hide_edge_borders both
#     ^ edge/smart border hiding is not supported
# line 33: for_window [window_role="pop-up"] floating enable
#     ^ none of the criteria can be matched on macOS
